# AgentOS 集群配置文件（单机模板）
# up 前请将下面的 127.0.0.1 替换为本机实际部署 IP；ADX 不从网卡列表猜测节点地址。
# --ip / BIND_IP 只能选择 cluster_nodes 中由本机持有的非回环、非通配地址。
#
# 此配置随 deploy 目录一起持久化到 ~/.agentos/deploy/config.yaml
# ansible 部署时会修改此文件后再执行 install
# 安装后仅修改本文件时，init/up/restart 会校验并同步到持久配置；
# 仅修改持久配置时保留该修改，两份均修改且不一致时需先手动统一。
#
# 配置格式说明：
#   etcd_nodes: etcd 集群节点列表（单机 1 节点 / 4 机 HA 3 节点）
#   master_nodes: master 节点列表（单机 1 节点 / 4 机 HA 2 节点）
#   cluster_nodes: 整个集群的全部节点列表（workspace 亲和 HRW 候选集 / 数据迁移节点来源）
#   ingress_virtual_ip: 统一入口虚拟 IP，抢占到 VIP 的节点部署 gateway/registry/web-server
#   trace_otlp_endpoints: AgentGateway、AgentRuntime、JiuwenSwarm 统一 tracing 配置
#     （host:port 形式，不要带 http:// 前缀；支持多项主备）。空列表/缺省 = 关闭 tracing。
#     取第一个地址注入全部组件（部署级主备）；主地址不可达时修改本列表后重新 up 切换。

cluster:
  # etcd 集群节点（奇数节点保证 raft 共识）
  etcd_nodes:
    - "127.0.0.1"

  # master 节点（主备）
  master_nodes:
    - "127.0.0.1"

  # 整个集群的全部节点（workspace 亲和 HRW 候选集；数据迁移按此列表计算归属）
  cluster_nodes:
    - "127.0.0.1"

  # 统一入口虚拟 IP（抢占成功后启动 gateway/registry/web-server）
  ingress_virtual_ip: "127.0.0.1"

# 全组件 tracing 总开关：非空时统一使用 OTLP gRPC，空列表关闭采集；修改后执行 up。
# 示例：trace_otlp_endpoints: ["10.0.0.1:4317", "10.0.0.2:4317"]
trace_otlp_endpoints: []
