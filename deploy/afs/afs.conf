# ============================================================
# AFS (OwnerFs) workspace 存储配置 — deploy/afs 模块
# 替代 autofs + NFS（workspace-storage）方案。
# ============================================================

# ---- 模块开关 ----
# auto/yes = 部署；no = 跳过（与 workspace-storage 的 WORKSPACE_STORAGE_ENABLED 语义一致）
AFS_ENABLED="auto"

# 进程托管: auto/yes = 有 systemd 用 systemd，否则 nohup 兜底
AFS_USE_SYSTEMD="auto"

# ---- 目录与安装路径 ----
# AFS 安装根（bin/etc/tls/data/mnt/run 都在其下；uninstall 保留 data/tls/bin）
AFS_ROOT="/opt/agentos/afs"
# 配置渲染输出目录（meta.toml / node.toml / deployment-afs.yaml）
AFS_ETC_DIR="/etc/agentos/afs"

# ---- 端口（AFS 默认值，来自 deployment-afs.md SOP）----
# meta: gRPC/REST；node: gRPC/REST
AFS_META_GRPC_PORT="7400"
AFS_META_REST_PORT="7401"
AFS_NODE_GRPC_PORT="7500"
AFS_NODE_REST_PORT="7501"
# （防火墙/端口仅对可信网段开放）。0.0.0.0 = 无认证管理面全网暴露，勿用。
AFS_WORKSPACE_API_LISTEN="127.0.0.1:18889"
AFS_WORKSPACE_API_ENABLED="yes"

# 唯一对外访问路径根 = AGENTOS_HOME_BASE 约定路径。
AFS_EGRESS_ROOT="/home/agentos/users"

# ---- AFS outlet 路径（ADX 新模式；AFS node 启动校验"存在+预期类型"，不符 fail-fast）----
# 物理层 = ownerfs 数据池本体，Node 的数据落在这里，再由 outlet mirror 发布到 egress。
# AFS_OUTLET_USERS_ROOT：留空 = 用 AFS_OWNERFS_DATA_DIR 的值（二者默认同一处）
#   （默认 /home/agentos/.users）。显式填写则以其为准。
#   注意：本行对下方才定义的变量不可引用（赋值顺序），故非空值须写全路径。
# 优先级：同名环境变量 > 本文件 > 脚本默认值。
AFS_OUTLET_USERS_ROOT="/home/agentos/.users"
# 拓扑层父目录（普通目录；跨节点 import/NFS pool 挂载落点；/run 下，重启由 ExecStartPre 重建）
AFS_OUTLET_IMPORT_ROOT="/run/afs/imports"
# outlet mirror 收敛周期（ms，10..=60000）。只影响 egress 名字的发布延迟，
# 不影响数据读写路径；调小可缩短 workspace 创建后名字可见的等待。
AFS_OUTLET_MIRROR_INTERVAL_MS="50"
AFS_OWNERFS_MOUNT="/run/afs/ownerfs"

# ownerfs 数据池根（= Node 内 workspace 物理落盘目录，渲染进 node.toml 的 ownerfs_data_dir）。
# 与 AFS_OUTLET_USERS_ROOT 是同一个位置的两种视角：前者是 AFS 内部数据根，
# 后者是集群约定的「每节点用户树路径」，用于拼 NFS 挂载源 <host>:<outlet_users_root>。
# 二者必须指向同一个目录，否则 NFS 会导出错路径、对端挂到空目录（见 deploy 侧联动校验）。
AFS_OWNERFS_DATA_DIR="/home/agentos/.users"
# 启动时把数据池根下已存在的第一级目录纳管为 workspace（老数据接管）。
# 只登记目录名（root-<hex(name)>）并接管内容，不 chmod/chown/删除原目录。
AFS_OWNERFS_ADOPT_ON_STARTUP="yes"

# ---- 数据与证书 ----
# 数据目录（uninstall 保留）
AFS_DATA_ROOT="/var/lib/agentos/afs"

# ---- 服务日志（meta / node 各自一份文件）----
# 留空 = 走 journald（默认，与早前行为一致；但 journal 是否持久取决于
#   /var/log/journal 是否存在，多数发行版默认不持久化，重启即丢）。
# 指定目录 = unit 用 StandardOutput/StandardError append 到
#   <dir>/afs-meta.log、<dir>/afs-node.log，并生成 logrotate 配置（每日/100M 轮转，
#   保留 14 份，copytruncate 原地截断，无需重启服务）。
# 与 workspace-storage / jiuwenbox 的落点惯例一致：/var/log/agentos/<组件>/
AFS_LOG_DIR="/var/log/agentos/afs"
# 日志属组（平台/运维侧可读）。组不存在时回落 root。
AFS_LOG_GROUP="agentos"

# mTLS 证书：脚本单一来源 = AFS 仓库 build/config/examples/afs/prepare-local-tls.sh，
# 随 --with-afs 包交付到 ${ADX_PACKAGE_DIR}/etc/examples/afs/；deploy 不再带副本。
# 留空 = 自动探测 ADX 包内路径；显式指定用于离线/预置场景。
AFS_TLS_PREPARE_SCRIPT=""
# 证书有效期（天）。脚本默认 30 天是"本机试用"语义，部署按 365 天签发；
# 到期前需重签（脚本幂等，删掉对应 .pem/-key.pem 后重跑 install 即可）。
AFS_TLS_DAYS="365"
# 导入已有 CA 的目录（须含 ca.pem + ca-key.pem）。集群首台留空=自建 CA；
# 其余节点填首台的 ${AFS_ROOT}/tls（或拷贝过来的 CA 目录），即可落入同一信任域、
# 各自用本机 node id 签发身份。CA 私钥须走可信通道分发。
AFS_TLS_CA_DIR=""

# ---- 默认属主（issue #91 §3.4.1，与 WORKSPACE_USER 语义对齐）----
AFS_WORKSPACE_DEFAULT_USER="agentos"
#AFS_WORKSPACE_DEFAULT_UID="1000"
#AFS_WORKSPACE_DEFAULT_GID="1000"

# ---- AFS 内部 NFS 导出（outlet_users_root，仅 pool 互访用）----
# 客户端白名单固定为 `*`（不限来源），与旧方案 workspace-storage 的导出语义一致，
# 不可配置。收敛暴露面请在网络层做（防火墙 / 安全组只放行 2049/tcp）。
# 导出仅开放 2049/tcp；insecure 见 afs_deploy.sh 渲染处的说明。
# exportfs fsid（必须非 0 且与集群内其他导出不冲突；workspace-storage 旧方案用 1）
AFS_NFS_EXPORT_FSID="11"

# ---- 托管方式 ----
# yes = unit 的 ExecStart 走 `adxctl -c deployment-afs.yaml run`（需产品包内 deployment 示例齐备）；
# no（默认）= ExecStart 直接拉起 afs-meta/afs-node 二进制（deployment-afs.md SOP 命令，字段已核对）。
# 两者都是 systemd 包裹（自愈/自启一致）；切换仅影响 ExecStart 一层。
AFS_USE_ADXCTL="no"
# adxctl 可执行文件（留空自动探测 PATH 与 ${ADX_PACKAGE_DIR}/bin）
#ADXCTL_BIN=""

# ---- workspace 创建通道 ----
# api（默认）: 走 workspace API，与业务真实路径（gateway → POST /v1/workspaces）同源，
#   home_dir == access_path 契约可被硬校验；需要 AFS_WORKSPACE_API_ENABLED=yes
# fuse: FUSE mkdir / rmdir，仅在 API 关闭或排障时使用
AFS_CREATE_MODE="api"

# ---- AFS Meta 选址（负载均衡）----
# true（默认 = 运行期）: Meta 把新建 workspace 分散到不同 Home（集群均衡；
#   存量 workspace 归属已固化于 Meta，不受本开关影响）
# false: 关负载均衡，入口节点即 Home——仅在需要"新建 workspace 落受理节点"时临时使用
# 注意: 长期处于 false 时新 workspace 全部落在受理节点（通常单点 Gateway）→ 单点热点
AFS_MKDIR_LOAD_BALANCE="true"

