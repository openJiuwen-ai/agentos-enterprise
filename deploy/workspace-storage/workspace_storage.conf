# Workspace Storage Configuration (NFS + autofs + etcd)
# 存储层沿用本地盘 + NFSv4.1 + autofs；归属记录存放在 etcd 单 key，
# 由每节点 agentos-workspace 服务（api + watchdog + cache writer 同进程）维护。

# 存储根目录（本机真实数据目录 / NFS 导出源）
WORKSPACE_STORAGE_ROOT="/home/agentos/.users"

# 访问根目录（autofs 间接挂载点，agent/管理面看到的路径）
WORKSPACE_ACCESS_ROOT="/home/agentos/users"

# NFS 版本
NFS_VERSION="4.1"

# autofs 负缓存秒数（lookup 失败 / ENOENT 缓存）。
# 保持极短：新建 owner 的归属记录写入后，若负缓存未过期，首次访问仍会 ENOENT。
# autofs 默认 60s；修改后需重新执行 deploy.sh install 使 master map 生效。
AUTOFS_NEGATIVE_TIMEOUT="1"

# ===== etcd（归属权威存储，唯一 key 前缀）=====
# 归属 key: ${WORKSPACE_ETCD_PREFIX}/<owner>，值 = 归属节点 IP。
# 与上一版本完全兼容，升级无需数据迁移；不新增任何状态/索引/节点注册 key。
WORKSPACE_ETCD_PREFIX="/agent-runtime/workspace"

# etcd 端点，逗号分隔，支持 http(s):// 前缀。
# 留空时由 deploy.sh 自动推导：ETCD_ENDPOINT → config.py etcd-nodes → 127.0.0.1:32379
WORKSPACE_ETCD_ENDPOINTS=""
#WORKSPACE_ETCD_ENDPOINTS="10.0.0.1:32379,10.0.0.2:32379"

# etcd TLS 开关与客户端证书（TLS 关闭时留空）
WORKSPACE_ETCD_TLS="false"
#WORKSPACE_ETCD_TLS_CA="/etc/agentos/etcd-tls/ca.crt"
#WORKSPACE_ETCD_TLS_CERT="/etc/agentos/etcd-tls/client.crt"
#WORKSPACE_ETCD_TLS_KEY="/etc/agentos/etcd-tls/client.key"

# etcdctl 单次查询超时（秒）；autofs 对延迟敏感，不宜过大
WORKSPACE_ETCD_TIMEOUT="2"

# etcdctl 路径；留空时自动按 ETCDCTL_PATH → /opt/agentos/etcd/current/bin/etcdctl
# → PATH → yr 包 third_party/etcd 探测，并在 install 时固化到 autofs 配置
ETCDCTL_PATH=""

# ===== 候选集与节点标识（HRW）=====
# HRW 候选节点 IP，逗号分隔；留空则取 config.py cluster-nodes。
# WORKSPACE_ENABLED=false 的节点应从此列表移除，只提供挂载能力。
WORKSPACE_CANDIDATE_NODES=""

# 稳定 node_id：留空时取 ADX_NODE_ID，再回落 node-<本机IP去点>。
# 与 ADX 同时配置且不一致时 install 直接失败。
WORKSPACE_NODE_ID=""

# 服务节点 IP 由部署写入 WORKSPACE_NODE_IP；直接启动服务时须设置它或 BIND_IP。

# 是否参与 HRW 归属分配（false = 只提供 NFS/autofs 挂载能力）
WORKSPACE_ENABLED="true"

# ===== agentos-workspace 服务（api + watchdog + cache writer 单进程）=====
# auto/yes = 部署服务；no = 只部署 NFS/autofs
WORKSPACE_SERVICE_ENABLED="auto"
# 服务托管方式：auto = 有 systemd 用 systemd，否则 nohup；yes = 强制 systemd；no = 强制 nohup
WORKSPACE_STORAGE_USE_SYSTEMD="auto"

# 对外 API 监听地址，只暴露 /healthz /metrics /v1/workspaces，且仅监听回环
WORKSPACE_API_LISTEN="127.0.0.1:18889"
# 内部 API 监听地址，只提供 /internal/ensure /internal/remove 与 /healthz（节点间代理走该端口）
# 不能绑定 127.0.0.1，且端口必须与 WORKSPACE_API_LISTEN 不同
WORKSPACE_INTERNAL_LISTEN="0.0.0.0:18890"
# 新建归属前探活候选节点的 /healthz 超时（秒）；探活失败则在剩余可用节点上重算 HRW
WORKSPACE_PROBE_TIMEOUT="1"
# 跨节点 ensure/remove 单次超时（秒）与重试次数
WORKSPACE_INTERNAL_TIMEOUT="3"
WORKSPACE_INTERNAL_RETRIES="1"
# /internal/* 允许的来源网段（逗号分隔 CIDR）。
# 留空表示按集群节点清单自动派生：WORKSPACE_CANDIDATE_NODES（安装时取自
# config.yaml 的 cluster_nodes）加本机 IP，逐节点生成 /32（IPv6 为 /128），
# 集群外来源一律 403；候选集缺失时只允许回环。
# 显式填写时以本配置为准（跨节点代理必须落在允许网段内）。
WORKSPACE_INTERNAL_ALLOW=""

# watchdog 体检周期（秒）
WORKSPACE_WATCHDOG_INTERVAL="60"

# 删除后 .trash 失败兜底保留秒数（正常删除路径下 .trash 应为空）
WORKSPACE_TRASH_RETENTION="86400"

# autofs 回落缓存（watchdog 周期性原子刷新，TSV: owner<TAB>node_ip）
WORKSPACE_CACHE_FILE="/var/lib/agentos-workspace/owners.cache"

# 默认 uid/gid 来源账号；服务启动时解析其 pw_uid/pw_gid，账号不存在回落 1000
WORKSPACE_USER="agentos"
# 显式覆盖 uid/gid（留空表示按 WORKSPACE_USER 解析）
WORKSPACE_DEFAULT_UID=""
WORKSPACE_DEFAULT_GID=""

# 默认 HTTP 无认证；/internal/* 仅允许上述白名单中的来源。

# 服务日志（systemd StandardOutput/StandardError 追加；logrotate 每日或 100M 轮转，保留 14 份）
WORKSPACE_LOG_FILE="/var/log/agentos/workspace-storage/workspace-api.log"
WORKSPACE_LOG_GROUP="agentos"

# 运行服务的 Python 解释器（留空自动探测；服务仅依赖标准库）
#WORKSPACE_PYTHON="/usr/bin/python3.11"

# 本机绑定 IP（与 deploy.sh --ip 语义一致）。多网卡/多 IP 节点建议显式配置，
# 否则 program_map 以本机全部 IPv4 地址判断归属
#BIND_IP=10.0.0.1
