# Workspace Storage Configuration (NFS + autofs)
# Replaces MooseFS deployment

# Storage root (real data directory on local disk, NFS export source)
WORKSPACE_STORAGE_ROOT="/home/agentos/.users"

# Access root (autofs indirect mount point, what agents/managers see)
WORKSPACE_ACCESS_ROOT="/home/agentos/users"

# NFS version
NFS_VERSION="4.1"

# etcd key prefix for workspace ownership
WORKSPACE_ETCD_PREFIX="/agent-runtime/workspace"

# etcdctl paths (reuse from third_party)
# ETCDCTL_PATH and ETCD_LD_PATH are set by the calling environment

# etcd query endpoint for autofs program_map (automount 环境无环境变量，从本 conf 自举)。
# 多节点用逗号分隔，etcdctl 自动故障切换；未配置时默认 127.0.0.1:32379
#ETCD_ENDPOINT=10.0.0.1:32379,10.0.0.2:32379

# 本机绑定 IP（与 deploy.sh --ip 语义一致）。多网卡/多 IP 节点建议显式配置，
# 否则 program_map 以 hostname -I 首个非环回 IP 判断归属
#BIND_IP=10.0.0.1
