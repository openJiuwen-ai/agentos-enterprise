profile: agentos
business_env_file: ${ADX_BUSINESS_ENV_FILE}
python: ${ADX_BUSINESS_PYTHON}
tenant: agentos
namespace: ${ADX_NAMESPACE}
token_file: ${ADX_CONFIG_DIR}/secrets/agentos-tenant-key
ca_file: ${ADX_CA_BUNDLE_FILE}
ingress_url: http://127.0.0.1:8080
workspace_root: /home/agentos/users
shared_workspace_sqlite: true
gateway:
  home: ${ADX_GATEWAY_HOME}
  host: 0.0.0.0
  port: 19001
  web_host: 0.0.0.0
  web_port: 19000
  static_port: 5173
  agentos:
    auth_enabled: true
    auth_service_url: http://${ADX_INGRESS_VIP}:8090
    registry:
      endpoint: http://${ADX_INGRESS_VIP}:4003
runtime:
  user: agentos
  # Builtin AgentServer only: host Python, commands and libraries mounted read-only.
  python_mounts: ${ADX_PYTHON_MOUNTS}
  # Explicit workspace semantics; ADXlet normalizes runsc's NFS/FUSE auto-append.
  workspace_mount_options: [rw, disable_file_handle_sharing]
  node_ingress_url: ${ADX_NODE_INGRESS_URL}
  agent_runtime: supervisor
  tool_runtime: runsc
  # Missing policies default to 3 node-local restarts (backoff 1s, capped at 30s).
  # Optional deployment overrides; null disables automatic restart for that role.
  # Existing gateway/workspace restart_policy overrides remain effective.
  # agent_restart_policy: {maxAttempts: 3, initialBackoffSeconds: 1, maxBackoffSeconds: 30}
  # tool_restart_policy: {maxAttempts: 3, initialBackoffSeconds: 1, maxBackoffSeconds: 30}
  # Conch code/config/artifacts are retained. agentos.sh derives
  # AGENTOS_CONCH_MODULE from the final MODULES list; when conch is not in
  # MODULES, configure/runsc-node-config strip conch class/socket and backend
  # defaults so ADX startup never probes conchd.
  tool_runtimes: [runsc, conch]
  conch_image: agentos-tools:v1
  # Tool sandbox Docker image. Fixed deployment-owned reference; when it is
  # missing locally, the deployment always allows a registry pull.
  tool_image: swr.cn-southwest-2.myhuaweicloud.com/yuanrong-dev/tool-sandbox:latest
  # Fixed offline archive: /root/resources/MindAgent-image/<arch>/tool-sandbox_latest.tar
  # Optional overrides for the fixed offline archive (absolute directory).
  # tool_image_dir: /root/resources/MindAgent-image
  # tool_image_tar: tool-sandbox_latest.tar
  local_image_bindings_file: ${ADX_LOCAL_IMAGE_BINDINGS_FILE}
  # With runsc enabled, Local rootfs defaults to descendants of <local_image_root>/objects.
  # Override with deployment-controlled absolute directories. An empty list disables it.
  # allowed_local_rootfs_dirs: [/var/lib/agentos/local-images/objects]
  # Optional offline Docker archive paths, keyed by their original image reference.
  # local_images:
  #   my-tools:v1: {}  # already loaded in the local Docker store
  #   ubuntu:24.04:
  #     archive: /root/resources/images/ubuntu-24.04.tar
  # Deployment exports these images once and provides Local paths and image
  # metadata to builtin launch/workspace settings. Third-party launch-spec writers
  # prepare their own complete Local specs. ADX receives the Local source directly.
  # Supervisor retains its builtin binding; deployment resolves the selected tool_image.
  # Explicit agent_image/tool_image values must match the selected runtime.
  # Optional native ADX checkpoint_storage mapping; cross-node restore requires shared storage.
  # Keep checkpoint files outside user workspace mounts.
  runtime_control:
    key_file: ${ADX_CONFIG_DIR}/secrets/runtime-control-key
network:
  # Optional Supervisor IPv4 pool. When unset, each node selects and reuses a route-compatible pool.
  # supervisor_subnet: <IPv4 CIDR>
  # Outbound business access: N0 closed, N1 explicit origins, N2 public Internet.
  # These presets apply to the managed runsc AgentServer and tool runtimes.
  agent_profile: N2
  tool_profile: N2
  ingress_policy_peer: agentos-ingress.node.invalid
  ingress_port: 8080
  runtime_control_port: 19103
  allowed_internal_origins: []
  tool_origins: []
